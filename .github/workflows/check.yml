name: Check skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Check PowerShell syntax and read-only diagnostics
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          ./install.ps1 -CheckOnly
      - name: Check Windows PowerShell 5.1
        shell: powershell
        run: ./install.ps1 -CheckOnly
